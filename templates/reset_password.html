{% extends "auth_base.html" %}
{% block title %}Choose a password — JobSearch{% endblock %}
{% block subtitle %}Choose a new password{% endblock %}
{% block content %}
<form method="post" autocomplete="on">
  <label for="password">New password</label>
  <input id="password" name="password" type="password" required minlength="8" autofocus
         autocomplete="new-password">
  <label for="password_confirmation">Confirm new password</label>
  <input id="password_confirmation" name="password_confirmation" type="password" required
         minlength="8" autocomplete="new-password">
  <button type="submit">Set password</button>
</form>
<p class="note">Setting a password signs out any other device already using this
   account.</p>
{% endblock %}
