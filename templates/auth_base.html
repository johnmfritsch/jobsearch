<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}JobSearch{% endblock %}</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f6f7fb;
         display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
  .card { background: #fff; padding: 28px; width: min(400px, 100%);
          border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { margin: 0 0 4px; font-size: 22px; color: #16324f; }
  .sub { margin: 0 0 20px; color: #64748b; font-size: 14px; }
  label { display: block; font-size: 13px; color: #334155; margin: 12px 0 4px; }
  input { width: 100%; padding: 11px; border: 1px solid #cbd5e1; border-radius: 6px;
          font-size: 15px; }
  input:focus { outline: 2px solid #2d5f8a; outline-offset: 1px; border-color: #2d5f8a; }
  button { width: 100%; padding: 12px; margin-top: 18px; background: #2d5f8a; color: #fff;
           border: 0; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #24507a; }
  .links { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  a { color: #2d5f8a; font-size: 14px; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .flash { padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 14px; }
  .flash.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
  .flash.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
  .note { margin-top: 18px; font-size: 13px; color: #64748b; line-height: 1.5; }
</style>
</head>
<body>
<main class="card">
  <h1>JobSearch</h1>
  <p class="sub">{% block subtitle %}{% endblock %}</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
