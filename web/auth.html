<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobSearch sign in</title><style>body{font-family:Arial;background:#f6f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:28px;width:min(380px,90vw)}input,button{box-sizing:border-box;width:100%;padding:11px;margin:6px 0}button{background:#1769aa;color:#fff;border:0}section{display:none}section.active{display:block}a{display:block;margin:12px 0;color:#075985}#message{color:#b91c1c}</style><main class="card"><h1>JobSearch</h1><section id="login" class="active"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signIn()">Sign in</button><a onclick="show('register')">Create a new account</a><a onclick="show('claim')">Claim an imported profile</a></section><section id="register"><input id="displayName" placeholder="Display name"><input id="newEmail" type="email" placeholder="Email"><input id="newPassword" type="password" placeholder="Password (8+ characters)"><input id="newPasswordConfirmation" type="password" placeholder="Confirm password"><button onclick="register()">Create account</button><a onclick="show('login')">Back to sign in</a></section><section id="claim"><input id="claimProfile" placeholder="Imported profile name"><input id="claimCode" placeholder="One-time claim code"><input id="claimName" placeholder="Display name"><input id="claimEmail" type="email" placeholder="Email"><input id="claimPassword" type="password" placeholder="Password (8+ characters)"><input id="claimPasswordConfirmation" type="password" placeholder="Confirm password"><button onclick="claim()">Claim profile</button><a onclick="show('login')">Back to sign in</a></section><div id="message"></div></main><script>const api='/JobSearch/DEV/api.php?endpoint=',v=id=>document.getElementById(id).value;function show(id){document.querySelectorAll('section').forEach(x=>x.classList.toggle('active',x.id===id));message.textContent=''}async function call(e,b){let r=await fetch(api+e,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}async function signIn(){try{await call('login',{email:v('email'),password:v('password')});location='/JobSearch/DEV/portal.html'}catch(e){message.textContent=e.message}}async function register(){if(v('newPassword')!==v('newPasswordConfirmation')){message.textContent='Passwords do not match';return}try{let email=v('newEmail'),password=v('newPassword');await call('register',{display_name:v('displayName'),email,password,password_confirmation:v('newPasswordConfirmation')});await call('login',{email,password});location='/JobSearch/DEV/portal.html'}catch(e){message.textContent=e.message}}async function claim(){if(v('claimPassword')!==v('claimPasswordConfirmation')){message.textContent='Passwords do not match';return}try{await call('claim_imported',{legacy_directory:v('claimProfile'),claim_code:v('claimCode'),display_name:v('claimName'),email:v('claimEmail'),password:v('claimPassword'),password_confirmation:v('claimPasswordConfirmation')});location='/JobSearch/DEV/portal.html'}catch(e){message.textContent=e.message}}</script>
